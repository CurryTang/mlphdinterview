apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: llmjobs.llmtrainlab.io
spec:
  group: llmtrainlab.io
  names:
    kind: LLMJob
    plural: llmjobs
    singular: llmjob
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                team: {type: string}
                model: {type: string}
                method: {type: string, enum: [full, lora, qlora, rlhf, rlaif, infer]}
                engine: {type: string}
                gpuType: {type: string}
                workers: {type: integer}
                gpusPerWorker: {type: integer}
                parallelism:
                  type: object
                  properties:
                    dp: {type: integer}
                    tp: {type: integer}
                    pp: {type: integer}
                    ep: {type: integer}
                requireRdma: {type: boolean}
                preferSameNode: {type: boolean}
                qos: {type: string}
